# Copy to tezcatlipoca.toml (gitignored) and fill in real values; TEZ_CONFIG selects a
# different file. Every key also takes a TEZ_-prefixed env override and the env wins, which
# is how the run queue injects per-run values. Naming and precedence: docs/architecture.md
# § Secrets and state. Secrets never go in this file.

[proxmox]
endpoint = "https://PROXMOX-HOST:8006"
node = "CHANGEME"
datastore = "CHANGEME"
# The base image the per-competition engine template is built from.
template_vm_id = 0
# api_token is read from $TEZ_PROXMOX_API_TOKEN.
mgmt_bridge = "vmbr0"
# Pin the pveproxy certificate instead of accepting a self-signed one (set one):
# tls_fingerprint = "AA:BB:CC:DD:..."
# ca_bundle = "/etc/pve/pve-root-ca.pem"

[ssh]
public_key = "ssh-ed25519 CHANGEME range-automation"
# Relative paths resolve against the checkout root.
private_key_path = "proxmox"

[engine]
username = "sysadmin"
# Static mgmt IP for the engine; empty keeps the built-in default (constants.py).
# mgmt_ip = "10.0.0.250"
# mgmt_gw = "10.0.0.1"
# Band automatic selection scans when no address is set (START-END; empty keeps the
# built-in 10.0.0.251-10.0.0.254). Only used when every running guest answers its agent.
# mgmt_ip_band = "10.0.0.251-10.0.0.254"

# Multi-node: nodes.json references each host's API token BY ENV-VAR NAME, so give each
# additional host its own variable and point the record at it. See docs/multi-node.md.

# Remote access (headscale). Required unless the Compfile opts out with `remote_access 0`.
[headscale]
# url = "https://headscale.example"
# ssh_host = "203.0.113.10"
# ssh_user = "sysadmin"
# ssh_password = ""
# infra_user = "cyberrange-infra"
# key_ttl = "72h"

# Student portal (Compfile `portal 1`). Put the tunnel pair ONLY in the event's profile:
# a practice profile that carries it would claim the stable public hostname.
[portal]
# hostname = "range.example.com"
# tunnel_token = ""
# open = false

[knobs]
# Fraction of the *provisioned* disk math the datastore headroom preflight counts, for
# thin-provisioned pools where provisioned >> used.
# thin_headroom = 0.5
# Blue agent cycle budget in seconds.
# cycle_timeout = 1500
# Interpreter for the harness's operator-side children (default: sys.executable).
# python = ""
# Competition definitions live outside the engine (tezcatlipoca-competitions).
# competitions_root = ""
# Where test-run folders are archived outside the repo.
# artifacts_archive = ""
# Gaia (the Mythic C2 installer) checkout on the engine host.
# gaia_path = ""
